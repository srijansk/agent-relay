<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="How agent-relay's lessons compound across runs — a three-panel flow showing rejection, distillation, and approval">
  <defs>
    <!-- Arrow marker (neutral slate) -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>

    <!-- Soft 1px panel shadow -->
    <filter id="panel-shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- ClipPaths so colored header strips inherit panel rounded corners -->
    <clipPath id="clip-p1"><rect x="30"   y="160" width="460" height="440" rx="12"/></clipPath>
    <clipPath id="clip-p2"><rect x="560"  y="160" width="480" height="440" rx="12"/></clipPath>
    <clipPath id="clip-p3"><rect x="1110" y="160" width="460" height="440" rx="12"/></clipPath>

    <!-- Reusable warning glyph for lesson cards -->
    <symbol id="warn-icon" viewBox="0 0 18 16">
      <path d="M 9 1.5 L 17 14.5 L 1 14.5 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="9" y1="6" x2="9" y2="11" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="9" cy="13" r="0.85" fill="#d97706"/>
    </symbol>

    <style>
      .ff       { font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; }
      .mono     { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .title    { font-weight: 700; letter-spacing: -0.01em; }
      .panel-h  { font-weight: 600; }
      .heading  { font-weight: 600; letter-spacing: -0.005em; }
      .chip     { font-weight: 500; }
      .chip-b   { font-weight: 600; }
      .body     { font-weight: 400; }
      .it       { font-style: italic; font-weight: 400; }
    </style>
  </defs>

  <!-- ============= CANVAS ============= -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- ============= TOP STRIP (40px, white) ============= -->
  <text x="800" y="28" class="ff title" font-size="22" fill="#0f172a" text-anchor="middle">How agent-relay's lessons compound across runs</text>

  <!-- ============= ARROW LABELS (above panels) ============= -->
  <text x="525" y="120" class="ff it" font-size="13" fill="#64748b" text-anchor="middle">snapshot to .relay/history/</text>
  <text x="1075" y="120" class="ff it" font-size="13" fill="#64748b" text-anchor="middle">injected into planner prompt</text>

  <!-- ============= INTER-PANEL ARROWS ============= -->
  <path d="M 493 184 Q 525 132 557 184" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1043 184 Q 1075 132 1107 184" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================================================= -->
  <!-- ============= PANEL 1: RUN 1 (RED) ============= -->
  <!-- ================================================= -->
  <g filter="url(#panel-shadow)">
    <rect x="30" y="160" width="460" height="440" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#clip-p1)">
    <rect x="30" y="160" width="460" height="48" fill="#fee2e2"/>
  </g>
  <text x="50" y="190" class="ff panel-h" font-size="14" fill="#7f1d1d">Run 1 · bug-rca-fix · timezone bug</text>

  <!-- chip 1 -->
  <rect x="50" y="232" width="420" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="66" y="259" class="ff chip" font-size="14" fill="#334155">rca_reproducer</text>
  <text x="200" y="259" class="ff body" font-size="14" fill="#94a3b8">→</text>
  <text x="222" y="259" class="ff mono" font-size="13" fill="#334155">repro.md</text>

  <!-- chip 2 -->
  <rect x="50" y="292" width="420" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="66" y="319" class="ff chip" font-size="14" fill="#334155">planner</text>
  <text x="200" y="319" class="ff body" font-size="14" fill="#94a3b8">→</text>
  <text x="222" y="319" class="ff mono" font-size="13" fill="#334155">plan.md</text>

  <!-- chip 3 — REQUEST_CHANGES (red) -->
  <rect x="50" y="352" width="420" height="44" rx="6" fill="#dc2626"/>
  <text x="66" y="379" class="ff chip-b" font-size="15" fill="#ffffff">✗</text>
  <text x="86" y="379" class="ff chip" font-size="14" fill="#fee2e2">reviewer</text>
  <text x="200" y="379" class="ff body" font-size="14" fill="#fca5a5">→</text>
  <text x="222" y="379" class="ff chip-b" font-size="14" fill="#ffffff">REQUEST_CHANGES</text>

  <!-- footnote -->
  <text x="50" y="438" class="ff it" font-size="12" fill="#64748b">Hit iteration cap. Plan had vague rollback,</text>
  <text x="50" y="456" class="ff it" font-size="12" fill="#64748b">no failing test, missed adjacent paths.</text>

  <!-- excerpt: the actual rejected rollback line, for concreteness -->
  <rect x="50" y="490" width="420" height="80" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="62" y="510" class="ff it" font-size="11" fill="#991b1b">from rejected plan.md, "Risk and rollback":</text>
  <text x="62" y="532" class="ff mono" font-size="11.5" fill="#475569">"Revert the changes by checking out the</text>
  <text x="62" y="550" class="ff mono" font-size="11.5" fill="#475569">previous commit using its hash..."</text>

  <!-- ================================================= -->
  <!-- ============= PANEL 2: DISTILL (AMBER) ========= -->
  <!-- ================================================= -->
  <g filter="url(#panel-shadow)">
    <rect x="560" y="160" width="480" height="440" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#clip-p2)">
    <rect x="560" y="160" width="480" height="48" fill="#fef3c7"/>
  </g>
  <text x="580" y="190" class="mono panel-h" font-size="14" fill="#92400e">relay distill --llm</text>

  <!-- centred heading -->
  <text x="800" y="244" class="ff heading" font-size="20" fill="#78350f" text-anchor="middle">5 forward-looking lessons</text>

  <!-- lesson card 1 -->
  <rect x="580" y="266" width="440" height="58" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <use href="#warn-icon" x="594" y="282" width="18" height="16"/>
  <text x="622" y="291" class="ff body" font-size="13" fill="#1f2937">Always include a specific failing test that</text>
  <text x="622" y="310" class="ff body" font-size="13" fill="#1f2937">demonstrates the bug before applying any fixes.</text>

  <!-- lesson card 2 -->
  <rect x="580" y="336" width="440" height="58" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <use href="#warn-icon" x="594" y="352" width="18" height="16"/>
  <text x="622" y="361" class="ff body" font-size="13" fill="#1f2937">Always specify the exact file changes or</text>
  <text x="622" y="380" class="ff body" font-size="13" fill="#1f2937">commits to undo in the rollback section.</text>

  <!-- lesson card 3 -->
  <rect x="580" y="406" width="440" height="58" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <use href="#warn-icon" x="594" y="422" width="18" height="16"/>
  <text x="622" y="431" class="ff body" font-size="13" fill="#1f2937">Explicitly review and test adjacent code</text>
  <text x="622" y="450" class="ff body" font-size="13" fill="#1f2937">paths for similar issues.</text>

  <!-- "+ 2 info-level" indicator (the spec'd 5 total) -->
  <text x="800" y="488" class="ff it" font-size="12" fill="#a16207" text-anchor="middle">+ 2 info-level lessons (not shown)</text>

  <!-- footnote -->
  <text x="800" y="540" class="ff it" font-size="11" fill="#92400e" text-anchor="middle">compiled from Run 1 · groups bullets · rewrites in 2nd-person ·</text>
  <text x="800" y="556" class="ff it" font-size="11" fill="#92400e" text-anchor="middle">preserves run-id provenance</text>

  <!-- ================================================= -->
  <!-- ============= PANEL 3: RUN 2 (GREEN) =========== -->
  <!-- ================================================= -->
  <g filter="url(#panel-shadow)">
    <rect x="1110" y="160" width="460" height="440" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#clip-p3)">
    <rect x="1110" y="160" width="460" height="48" fill="#dcfce7"/>
  </g>
  <text x="1130" y="190" class="ff panel-h" font-size="14" fill="#14532d">Run 2 · different bug · same task class</text>

  <!-- chip 1: planner with lessons-read pill -->
  <rect x="1130" y="232" width="420" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1146" y="259" class="ff chip" font-size="14" fill="#334155">planner</text>
  <text x="1213" y="259" class="ff body" font-size="14" fill="#94a3b8">→</text>
  <text x="1235" y="259" class="ff mono" font-size="13" fill="#334155">plan.md</text>
  <!-- pill -->
  <rect x="1438" y="244" width="100" height="20" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="1488" y="258" class="ff chip" font-size="11" fill="#15803d" text-anchor="middle">✓ lessons read</text>

  <!-- chip 2: reviewer APPROVE on first pass (green) -->
  <rect x="1130" y="292" width="420" height="44" rx="6" fill="#16a34a"/>
  <text x="1146" y="319" class="ff chip-b" font-size="15" fill="#ffffff">✓</text>
  <text x="1166" y="319" class="ff chip" font-size="14" fill="#dcfce7">reviewer</text>
  <text x="1281" y="319" class="ff body" font-size="14" fill="#86efac">→</text>
  <text x="1303" y="319" class="ff chip-b" font-size="14" fill="#ffffff">APPROVE on first pass</text>

  <!-- chip 3: auditor APPROVE (green-tinted) -->
  <rect x="1130" y="352" width="420" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="1146" y="379" class="ff chip-b" font-size="15" fill="#15803d">✓</text>
  <text x="1166" y="379" class="ff chip" font-size="14" fill="#14532d">auditor</text>
  <text x="1281" y="379" class="ff body" font-size="14" fill="#16a34a">→</text>
  <text x="1303" y="379" class="ff chip-b" font-size="14" fill="#14532d">APPROVE</text>

  <!-- quoted block — Run 2 reviewer verdict -->
  <rect x="1130" y="420" width="420" height="150" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="1130" y="420" width="4" height="150" fill="#16a34a"/>
  <text x="1148" y="446" class="ff it" font-size="12" fill="#334155">"The plan includes a failing test-first</text>
  <text x="1148" y="464" class="ff it" font-size="12" fill="#334155">approach... the rollback strategy is concrete,</text>
  <text x="1148" y="482" class="ff it" font-size="12" fill="#334155">specifying the file and nature of the change to</text>
  <text x="1148" y="500" class="ff it" font-size="12" fill="#334155">be reverted... considers adjacent paths..."</text>
  <text x="1538" y="552" class="ff" font-size="11" fill="#64748b" text-anchor="end">— Run 2 reviewer verdict</text>

  <!-- ============= SUMMARY DATA STRIP ============= -->
  <text x="800" y="688" class="ff" font-size="14" font-weight="500" text-anchor="middle" fill="#475569"><tspan>Captured run · </tspan><tspan fill="#991b1b" font-weight="600">Run 1 hit cap on iteration 4</tspan><tspan fill="#94a3b8">  →  </tspan><tspan fill="#92400e" font-weight="600">distill produced 5 lessons</tspan><tspan fill="#94a3b8">  →  </tspan><tspan fill="#166534" font-weight="600">Run 2 approved on iteration 1</tspan></text>
  <text x="800" y="712" class="ff it" font-size="12" fill="#94a3b8" text-anchor="middle">Reviewer's APPROVE message cited each of the 3 warn-level lessons by name. See docs/demo-output/.</text>

  <!-- ============= BOTTOM STRIP (60px, slate-50) ============= -->
  <line x1="0" y1="840" x2="1600" y2="840" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="840" width="1600" height="60" fill="#f8fafc"/>
  <text x="30" y="876" class="ff" font-size="13" font-weight="500" fill="#475569">agent-relay · multi-agent workflows that learn from past runs</text>
  <text x="1570" y="876" class="ff mono" font-size="12" fill="#94a3b8" text-anchor="end">github.com/srijansk/agent-relay</text>
</svg>
